# Publishes a release when a version tag is pushed:  git tag v1.2.0 && git push origin v1.2.0
# It builds social-mockup-studio.skill from skills/social-mockup-studio/ and attaches it to the GitHub release,
# so https://github.com/Inno-Merkle-TH/social-mockup-skill/releases/latest/download/social-mockup-studio.skill
# always serves the newest version.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the .skill
        run: python3 tools/build_skill.py --tag "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/social-mockup-studio.skill \
            --title "Social Mockup Studio $GITHUB_REF_NAME" --notes-file dist/release-notes.md --latest
