<style>
  /* demo-only creative art (in real projects, use the brand's KV / product photos) */
  .art { position: absolute; inset: 0; background: var(--brand-grad); color: var(--brand-on-primary); display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; font-family: var(--brand-head); overflow: hidden; }
  .art::before { content: ""; position: absolute; right: -40px; top: -30px; width: 230px; height: 230px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #C98A5B, #6B4330 60%, transparent 61%); opacity: .9; }
  .art::after { content: ""; position: absolute; right: 26px; top: 40px; width: 74px; height: 74px; background: var(--brand-logo) center / contain no-repeat; opacity: .9; }
  .art .k { font: 700 11px/1 var(--brand-body); letter-spacing: 1.6px; text-transform: uppercase; color: var(--brand-accent); position: relative; }
  .art .h { font: 700 26px/1.08 var(--brand-head); letter-spacing: -.5px; margin-top: 8px; position: relative; }
  .art .s { font: 400 12.5px/1.4 var(--brand-body); opacity: .85; margin-top: 6px; position: relative; }
  .art.tall .h { font-size: 38px; } .art.tall { justify-content: center; padding: 0 22px 18%; }
  .art.tall::after, .fb-cc .art::after, .flex.micro .art::after, .fbd-ad .art::after, .tt-pcard .art::after, .ln-car .art::after { display: none; }
  .chip { display: inline-block; background: var(--brand-accent); color: #fff; font: 700 11px var(--brand-body); padding: 4px 9px; border-radius: 10px; margin-top: 10px; position: relative; width: max-content; }
