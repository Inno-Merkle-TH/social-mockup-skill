<!DOCTYPE html>

<style>
  /* demo-only creative art (in real projects, use the brand's KV / product photos) */
  .art { position: absolute; inset: 0; background: var(--brand-grad); color: var(--brand-on-primary); display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; font-family: var(--brand-head); overflow: hidden; }
  .art::before { content: ""; position: absolute; right: -40px; top: -30px; width: 230px; height: 230px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #C98A5B, #6B4330 60%, transparent 61%); opacity: .9; }
  .art::after { content: ""; position: absolute; right: 26px; top: 40px; width: 74px; height: 74px; background: var(--brand-logo) center / contain no-repeat; opacity: .9; }
  .art .k { font: 700 11px/1 var(--brand-body); letter-spacing: 1.6px; text-transform: uppercase; color: var(--brand-accent); position: relative; }
  .art .h { font: 700 26px/1.08 var(--brand-head); letter-spacing: -.5px; margin-top: 8px; position: relative; }
  .art .s { font: 400 12.5px/1.4 var(--brand-body); opacity: .85; margin-top: 6px; position: relative; }
  .art.tall .h { font-size: 38px; } .art.tall { justify-content: center; padding: 0 22px 18%; }
  .art.tall::after, .fb-cc .art::after, .flex.micro .art::after, .fbd-ad .art::after, .tt-pcard .art::after, .ln-car .art::after { display: none; }
  .chip { display: inline-block; background: var(--brand-accent); color: #fff; font: 700 11px var(--brand-body); padding: 4px 9px; border-radius: 10px; margin-top: 10px; position: relative; width: max-content; }
  /* realistic ad creative = real photo + small brand mark (+ optional tag/price). Mirrors how real brand ads are built */
  .fx-hero > img, .fb-media > img, .fb-cc .im > img, .fb-full > img, .tt .vid > img, .ttd-vid > img, .tt-pcard .im > img, .fbd-ad .im > img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fx-hero, .fb-media, .fb-cc .im, .fbd-ad .im { position: relative; }
  .ad-logo { position: absolute; left: 10px; top: 10px; width: 34px; height: 34px; border-radius: 50%; background: var(--brand-primary) var(--brand-logo) center / 62% no-repeat; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .ad-logo.lg { left: auto; right: 16px; top: 120px; width: 44px; height: 44px; }
  .ad-tag { position: absolute; left: 10px; bottom: 10px; background: var(--brand-primary); color: var(--brand-on-primary); font: 700 11px/1 var(--brand-body); letter-spacing: 1px; padding: 7px 10px; border-radius: 4px; }
  .ad-price { position: absolute; right: 10px; bottom: 10px; background: #fff; color: var(--brand-primary); font: 800 16px/1 var(--brand-head); padding: 7px 10px; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .story-hl { position: absolute; left: 22px; right: 22px; bottom: 150px; color: #fff; font: 700 34px/1.08 var(--brand-head); letter-spacing: -.5px; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
  .fb-peek-img > img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fb-peek-img::after { display: none; }
  /* LINE rich message art (= one designed 1040px image: photo + big type; brand font is fine INSIDE the image) */
  .rmsg-art { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(43,27,18,0) 30%, rgba(43,27,18,.92) 58%); color: #fff; padding: 22px 20px 0 52%; display: flex; flex-direction: column; align-items: flex-start; font-family: var(--brand-head); }
  .rmsg-logo { position: absolute; left: 16px; top: 16px; width: 46px; height: 46px; border-radius: 50%; background: var(--brand-primary) var(--brand-logo) center / 62% no-repeat; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .rmsg-k { white-space: nowrap; font: 700 11px/1.2 var(--brand-body); letter-spacing: 1.2px; color: var(--brand-accent); }
  .rmsg-h { font: 800 40px/0.98 var(--brand-head); letter-spacing: -1px; margin-top: 10px; }
  .rmsg-s { font: 500 14px/1.3 var(--brand-body); opacity: .9; margin-top: 10px; }
  .rmsg-b { margin-top: 16px; background: #fff; color: var(--brand-primary); font: 800 16px/1 var(--brand-head); padding: 11px 18px; border-radius: 22px; }
  /* rich menu template sheet */
  .rmboard { background: #fff; padding: 22px 24px 8px; width: 1180px; font-family: var(--f-desktop); --brand-surface: #F2F4F7; }
  .rmb-h { font: 700 13px/1 var(--f-desktop); letter-spacing: 1.2px; text-transform: uppercase; color: #6B7280; margin: 6px 0 12px; }
  .rmb-g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 22px; margin-bottom: 22px; }
  .rmb .rm-art { border-radius: 4px; box-shadow: 0 0 0 1px #DADDE1; }
  .rmb .rm-art .rm-t { font: 700 18px var(--f-desktop); color: #9AA3AE; }
  .rmb-n { font: 400 13px/1.3 var(--f-desktop); margin-top: 8px; color: #111; } .rmb-n b { font-weight: 700; margin-right: 4px; }
  .rmb-d { font: 400 12px/1.3 var(--f-desktop); color: #6B7280; }
  /* TikTok native text sticker (classic style: white text on black rounded box / plain with shadow) */
  .tt-sticker { position: absolute; left: 50%; transform: translateX(-50%); z-index: 2; text-align: center; white-space: nowrap; font: 700 19px/1.35 var(--f-tiktok); color: #fff; background: rgba(0,0,0,.78); padding: 4px 10px; border-radius: 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .tt-sticker.plain { background: none; text-shadow: 0 0 3px rgba(0,0,0,.9), 0 1px 2px rgba(0,0,0,.8); font-size: 21px; }
</style>
